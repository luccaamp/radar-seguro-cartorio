# Pacotes de dados em Releases do GitHub (D-030). Usado por scripts/empacotar_dados.py e scripts/baixar_dados.py.
repositorios:
  publico: luccaamp/radar-seguro-cartorio          # público: qualquer pessoa baixa sem login
  equipe: luccaamp/radar-seguro-cartorio-dados     # privado: só colaboradores convidados (gh autenticado)
tag:
  publico: dados-{carga}
  equipe: carga-{carga}
# limite do GitHub: cada arquivo de Release abaixo de 2 GiB; as partes ficam com folga
tamanho_parte_bytes: 1992294400   # 1.900 MiB
camadas:
  publico: [silver]                    # o gold público já está no repositório (data/publico)
  equipe: [bronze, silver, gold, banco]
# arquivos do bronze que NÃO vão para o pacote da equipe, com o motivo
bronze_excluir:
  - padrao: "rais/*/extraido/*.COMT"
    motivo: extração do .7z da RAIS (o .7z vai no pacote; a coleta extrai de novo quando falta)
# --com-originais (D-032): originais grandes da pasta de originais (fora do OneDrive), em partes < 2 GiB.
# Vazio = todos (inclusive os .COMT extraídos da RAIS, como aprovado). Para deixá-los de fora (são deriváveis do .7z):
#   originais_excluir: [{padrao: "rais/*/extraido/*.COMT", motivo: "extração do .7z"}]
originais_excluir: []
# arquivos já comprimidos: vão para o zip como estão, sem comprimir de novo
ja_comprimidos: [".zip", ".7z", ".gz", ".xlsx", ".pdf", ".parquet"]
# só documentação: nenhum script lê esta chave; é a regra do passo 7 de docs/publicacao.md (o autor apaga à mão)
manter_ultimas_cargas: 3
# pastas FORA do OneDrive (CLAUDE.md, "Disco e OneDrive"); "~" é a pasta do usuário. Podem ser trocadas pelas
# variáveis de ambiente RADAR_PACOTES e RADAR_ORIGINAIS.
pastas:
  pacotes:            # saída padrão de scripts/empacotar_dados.py (pacotes/<nivel>)
    windows: 'C:\radar_pacotes'
    outros: '~/radar_pacotes'
  originais:          # originais grandes do bronze (D-032): baixados aqui pelo coletor, fora do bronze oficial
    windows: 'C:\radar_arquivo\bronze_originais'
    outros: '~/radar_arquivo/bronze_originais'
