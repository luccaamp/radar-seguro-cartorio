# Configuração por estado (Fase 3, D-081): tudo o que só vale para uma UF, com a fonte de cada valor.
# Quais UFs o pipeline processa continua em config/escopo.yaml (`ufs`); cada UF de lá precisa de uma entrada aqui
# (tests/test_estados.py). Um estado novo deve ser "só dado novo": uma entrada a mais neste arquivo.
#
# Campos de cada UF:
#   nome, cod_ibge          — identificação (IBGE, localidades)
#   pacote_rais             — arquivo do PDET (FTP da RAIS) que contém os vínculos da UF
#   apelidos_municipios     — grafias da fonte (sem acento, maiúsculas) → código IBGE de 7 dígitos
#   normas_locais           — normas da corregedoria estadual que mudam o modelo (lista; vazia = só as nacionais)
#   controle_arrecadacao    — totais de controle da arrecadação por semestre (F2, D-024); sem eles, o contrato vira aviso
#   premissas               — de onde vêm as premissas do modelo da UF (MG: a versão vigente; outro estado herda as de
#                             MG com `fonte: suposição` até a calibração da Fase 6, D-081)

MG:
  nome: Minas Gerais
  cod_ibge: 31
  fonte_cod_ibge: IBGE, API de localidades (servicodados.ibge.gov.br/api/v1/localidades/estados/31), coleta de 2026-10-18
  pacote_rais: RAIS_VINC_PUB_MG_ES_RJ.7z
  fonte_pacote_rais: ftp://ftp.mtps.gov.br/pdet/microdados/RAIS/2025/ (registro em data/bronze/rais/2025/original.json, coleta de 2026-10-17)
  apelidos_municipios:
    # Conferido pela IA comparando a grafia da fonte com a lista oficial do IBGE (Fase 1, 2026-10-18).
    BRASOPOLIS: 3108909        # CNPJ (Receita); IBGE: "Brazópolis"
    AMPARO DA SERRA: 3102506   # CNPJ (Receita); IBGE: "Amparo do Serra"
  normas_locais: []            # nenhuma norma da CGJ-MG muda o modelo hoje (plano_fase3.md, levantamento de 2026-11-07)
  controle_arrecadacao:
    # Universo: as 2.525 serventias ativas do cadastro de MG.
    silver:   # contrato 1 (erro): a carga não pode cair mais que a tolerância em relação a estes totais
      fonte: silver.serventia_arrecadacao (versão 1 de cada período), carga de 2026-10-18 a partir de data/bronze/cnj_justica_aberta/2026-10-18/arrecadacoes_MG.jsonl
      tolerancia_queda: 0.005
      totais: {"2025-1": 2379639987.32, "2025-2": 3133904766.00}
    bi:       # contrato 2 (aviso): conferência cruzada com o BI do CNJ (o arquivo, nacional, fica em config/qualidade.yaml)
      fonte: CNJ, Painel de Dados Estatísticos das Serventias Extrajudiciais (exportação manual em 2026-10-18)
      data_referencia: 2025-12-31
      totais: {"2025-1": 2373919679.17, "2025-2": 3067663494.52}
      tolerancias: {"2025-1": 0.01, "2025-2": 0.03}
      motivo_tolerancia_2025_2: BI incompleto no 2º sem/2025 (168 CNS de MG ausentes em 18/10/2026)
  premissas: vigente          # config/premissas/ (versão vigente); calibradas para MG

# Sudeste (D-088, 2026-11-12): SP, RJ e ES entram na camada 2 com as premissas HERDADAS de MG (`fonte: suposição`,
# D-081) até a calibração de cada estado. Os totais do BI saem do mesmo cálculo que deu os de MG (soma de "Valor
# arrecadação" do CSV nacional do BI, períodos de 01/01 a 30/06/2025 e de 01/07 a 31/12/2025, nos CNS ativos do cadastro
# de 2026-10-17 da UF; o cálculo reproduz exatamente os totais de MG acima). Sem total do silver: o primeiro é o da
# carga do Sudeste. Tolerâncias do BI iguais às de MG; o BI cobre menos cartórios nos estados novos (avisos).
SP:
  nome: São Paulo
  cod_ibge: 35
  fonte_cod_ibge: IBGE, API de localidades (servicodados.ibge.gov.br/api/v1/localidades/estados), coleta de 2026-11-11
  pacote_rais: RAIS_VINC_PUB_SP.7z
  fonte_pacote_rais: ftp://ftp.mtps.gov.br/pdet/microdados/RAIS/2025/ (listagem conferida em 2026-11-12; 1.107.305.918 bytes)
  apelidos_municipios: {}
  normas_locais: []            # não levantadas ainda (fonte: suposição: só as normas nacionais)
  controle_arrecadacao:
    bi:
      fonte: CNJ, Painel de Dados Estatísticos das Serventias Extrajudiciais (exportação manual em 2026-10-18)
      data_referencia: 2025-12-31
      totais: {"2025-1": 5052160959.98, "2025-2": 5806940679.74}
      tolerancias: {"2025-1": 0.01, "2025-2": 0.03}
      cobertura_bi: 1.552 e 1.509 dos 1.559 CNS ativos (1º e 2º sem/2025)
  premissas: herdada           # as de MG, como suposição, até a calibração (D-081)
RJ:
  nome: Rio de Janeiro
  cod_ibge: 33
  fonte_cod_ibge: IBGE, API de localidades (servicodados.ibge.gov.br/api/v1/localidades/estados), coleta de 2026-11-11
  pacote_rais: RAIS_VINC_PUB_MG_ES_RJ.7z
  fonte_pacote_rais: ftp://ftp.mtps.gov.br/pdet/microdados/RAIS/2025/ (o mesmo pacote de MG, já no bronze)
  apelidos_municipios:
    # Conferido pela IA comparando a grafia da fonte com a lista oficial do IBGE (D-088, 2026-11-11).
    PARATI: 3303807            # CNPJ (Receita); IBGE: "Paraty"
  normas_locais: []            # não levantadas ainda (fonte: suposição: só as normas nacionais)
  controle_arrecadacao:
    bi:
      fonte: CNJ, Painel de Dados Estatísticos das Serventias Extrajudiciais (exportação manual em 2026-10-18)
      data_referencia: 2025-12-31
      totais: {"2025-1": 1195145371.64, "2025-2": 1410684013.71}
      tolerancias: {"2025-1": 0.01, "2025-2": 0.03}
      cobertura_bi: 377 e 370 dos 457 CNS ativos (1º e 2º sem/2025; o BI cobre bem menos que em MG)
  premissas: herdada
ES:
  nome: Espírito Santo
  cod_ibge: 32
  fonte_cod_ibge: IBGE, API de localidades (servicodados.ibge.gov.br/api/v1/localidades/estados), coleta de 2026-11-11
  pacote_rais: RAIS_VINC_PUB_MG_ES_RJ.7z
  fonte_pacote_rais: ftp://ftp.mtps.gov.br/pdet/microdados/RAIS/2025/ (o mesmo pacote de MG, já no bronze)
  apelidos_municipios: {}
  normas_locais: []            # não levantadas ainda (fonte: suposição: só as normas nacionais)
  controle_arrecadacao:
    bi:
      fonte: CNJ, Painel de Dados Estatísticos das Serventias Extrajudiciais (exportação manual em 2026-10-18)
      data_referencia: 2025-12-31
      totais: {"2025-1": 354173159.64, "2025-2": 385037533.78}
