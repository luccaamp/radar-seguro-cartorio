# Tolerâncias das reconciliações entre fontes (SPEC §4). Acima da tolerância: aviso (não interrompe o pipeline).
# fonte: suposição (escolhidas para separar ruído de divergência que merece revisão).
tolerancias:
  serventias_cnj_x_cnpj_pct: 0.05       # o CNPJ superestima (CNPJs não baixados); divergência esperada, ver docs/historico/viabilidade.md
  empregados_cnj_x_rais_pct: 0.05       # na Fase 0: 1,8% de diferença em MG
  correlacao_minima_municipio: 0.95     # na Fase 0: 0,996 por município
  cobertura_arrecadacao_min: 0.95       # fração das ativas com receita de referência válida em 2025
  cobertura_colaboradores_min: 0.99
  vinculos_com_distribuicao_municipal_min: 0.50
  # C1 (PROPOSTA da IA, a confirmar pelo autor; critério anterior ao resultado, não escolhido para passar):
  correlacao_log_minima_municipio: 0.90          # correlação 'muito forte' convencional; insensível ao peso de BH
  erro_pct_mediano_max_municipio: 0.20           # mediana <= 20% equivale a metade dos municípios dentro de ±20%
  fracao_municipios_dentro_20pct_min: 0.75       # três quartos dos municípios com >= 5 empregados dentro de ±20%
  minimo_empregados_para_erro_pct: 5             # só municípios com >= 5 empregados em uma das fontes (evita ruído)

# Os totais de controle da arrecadação por semestre (F2; D-024) ficam por UF em config/estados.yaml
# (`controle_arrecadacao`, Fase 3). Aqui fica só o arquivo do BI do CNJ, que é nacional (todas as UFs num CSV).
bi_cnj:
  fonte: CNJ, Painel de Dados Estatísticos das Serventias Extrajudiciais (exportação manual em 2026-10-18)
  arquivo: data/bronze/cnj_bi_painel/2026-10-18/atos_arrecadacoes_custeio_e_repasse.csv
