# Tema do painel (docs/painel/padrao_visual.md, segunda rodada). Só aparência; nenhum dado.
[theme]
base = "light"
primaryColor = "#1f4e86"
backgroundColor = "#eef2f7"
secondaryBackgroundColor = "#e4ecf7"
textColor = "#16202e"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
baseRadius = "10px"
borderColor = "#d9e0ea"
linkColor = "#1f4e86"
chartCategoricalColors = ["#1f5bb8", "#f07f26", "#17a398", "#8d8b84"]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#e4ecf7"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
