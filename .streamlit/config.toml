# Tema do painel: as cores do protótipo V5 (docs/painel/prototipo_v5.html, D-082), as mesmas do src/painel/estilo.css,
# nos dois temas. Quem escolhe o tema é o botão Claro · Escuro · Sistema do próprio painel (src/painel/componentes/
# tema.js), que grava a escolha também para o Streamlit; o padrão é o claro. Só aparência; nenhum dado.
[theme]
font = "IBM Plex Sans"
headingFont = "IBM Plex Sans"
baseFontSize = 14
baseRadius = "8px"

# Fontes embutidas (D-080): servidas pelo próprio painel (app/static/fontes, licença OFL ao lado), sem pedido ao
# Google Fonts no navegador do visitante. Arquivos variáveis, subconjunto latino (cobre o português).
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fontes/ibm_plex_sans_latin.woff2"
weight = "100 700"
style = "normal"

[[theme.fontFaces]]
family = "Newsreader"
url = "app/static/fontes/newsreader_latin.woff2"
weight = "200 800"
style = "normal"

[server]
enableStaticServing = true

# claro (V5): --bg #f4f5f2, --surface-2 #f7f8f5, --ink #16201d, --line #e1e4de, --accent #0f6b5c
[theme.light]
primaryColor = "#0f6b5c"
backgroundColor = "#f4f5f2"
secondaryBackgroundColor = "#f7f8f5"
textColor = "#16201d"
borderColor = "#cbd0c8"
dataframeBorderColor = "#e1e4de"
linkColor = "#0b5649"
chartCategoricalColors = ["#1f5c99", "#b06f12", "#0f6b5c", "#6a7570"]

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f8f5"
textColor = "#16201d"
borderColor = "#e1e4de"

# escuro (V5): --bg #0f1312, --surface-2 #1b2120, --ink #e6ece9, acento #2fa98f
[theme.dark]
primaryColor = "#2fa98f"
backgroundColor = "#0f1312"
secondaryBackgroundColor = "#1b2120"
textColor = "#e6ece9"
borderColor = "#3d4945"
dataframeBorderColor = "#2c3532"
linkColor = "#7fd0bf"
chartCategoricalColors = ["#5c9ae0", "#e3a04a", "#46b39e", "#8a9590"]

[theme.dark.sidebar]
backgroundColor = "#161b1a"
secondaryBackgroundColor = "#1b2120"
textColor = "#e6ece9"
borderColor = "#2c3532"

[client]
# "minimal": sem o menu ⋮ do Streamlit (a troca de tema é o botão do painel, que funciona também no link público)
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
