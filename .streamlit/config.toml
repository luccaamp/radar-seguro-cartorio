# Tema do painel (docs/painel/padrao_visual.md, quarta rodada, D-052): os mesmos tokens do artefato "Raio-X do
# Cartório", nos dois temas dele. Como o Raio-X, o painel segue o tema do sistema (claro ou escuro); o menu do
# Streamlit também troca. Só aparência; nenhum dado.
[theme]
font = "IBM Plex Sans"
headingFont = "Newsreader"
baseFontSize = 14
baseRadius = "10px"

# Fontes embutidas (D-080): servidas pelo próprio painel (app/static/fontes, licença OFL ao lado), sem pedido ao
# Google Fonts no navegador do visitante. Arquivos variáveis, subconjunto latino (cobre o português).
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fontes/ibm_plex_sans_latin.woff2"
weight = "100 700"
style = "normal"

[[theme.fontFaces]]
family = "Newsreader"
url = "app/static/fontes/newsreader_latin.woff2"
weight = "200 800"
style = "normal"

[server]
enableStaticServing = true

# claro: --bg #eceff3, --surface-2 #f5f7fa, --ink #0f1c33, --line #dde2ea, --grid #e6e9ef, --s1 #2a78d6
[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#eceff3"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#0f1c33"
borderColor = "#dde2ea"
dataframeBorderColor = "#e6e9ef"
linkColor = "#2a78d6"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#8d97ab"]

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#0f1c33"
borderColor = "#dde2ea"

# escuro: --bg #0c1018, --surface #141a25, --surface-2 #1a2130, --ink #e9edf5, --line #262e3d, --grid #222a38, --s1 #3987e5
[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0c1018"
secondaryBackgroundColor = "#1a2130"
textColor = "#e9edf5"
borderColor = "#262e3d"
dataframeBorderColor = "#222a38"
linkColor = "#3987e5"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#7b869b"]

[theme.dark.sidebar]
backgroundColor = "#141a25"
secondaryBackgroundColor = "#1a2130"
textColor = "#e9edf5"
borderColor = "#262e3d"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
