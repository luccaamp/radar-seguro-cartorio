# Tema do painel (docs/painel/padrao_visual.md, quarta rodada, D-052): os mesmos tokens do artefato "Raio-X do
# Cartório", nos dois temas dele. Como o Raio-X, o painel segue o tema do sistema (claro ou escuro); o menu do
# Streamlit também troca. Só aparência; nenhum dado.
[theme]
font = "IBM Plex Sans"
headingFont = "Newsreader"
baseFontSize = 14
baseRadius = "10px"

# Fontes embutidas (D-080): servidas pelo próprio painel (app/static/fontes, licença OFL ao lado), sem pedido ao
# Google Fonts no navegador do visitante. Arquivos variáveis, subconjunto latino (cobre o português).
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fontes/ibm_plex_sans_latin.woff2"
weight = "100 700"
style = "normal"

[[theme.fontFaces]]
family = "Newsreader"
url = "app/static/fontes/newsreader_latin.woff2"
weight = "200 800"
style = "normal"

[server]
enableStaticServing = true

# claro: --bg #eceff3, --surface-2 #f5f7fa, --ink #0f1c33, --line #dde2ea, --grid #e6e9ef, --s1 #2a78d6
[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#eceff3"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#0f1c33"
borderColor = "#dde2ea"
dataframeBorderColor = "#e6e9ef"
linkColor = "#2a78d6"
chartCategoricalColors = ["#2a78d6", "#d65a26", "#178f64", "#78829a"]

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#0f1c33"
borderColor = "#dde2ea"

# escuro (2026-11-10): cinza neutro, sem o azul dos dados (era azul-marinho #0c1018, em que o mapa sumia):
# --fundo #121316, --superficie #1b1d21, --superficie-2 #25262a, --texto #eceef2, --linha #33363c, --grade #2b2e33
[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#121316"
secondaryBackgroundColor = "#25262a"
textColor = "#eceef2"
borderColor = "#33363c"
dataframeBorderColor = "#2b2e33"
linkColor = "#3987e5"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#7b869b"]

[theme.dark.sidebar]
backgroundColor = "#1b1d21"
secondaryBackgroundColor = "#25262a"
textColor = "#eceef2"
borderColor = "#33363c"

[client]
# "viewer": o menu (⋮, canto superior direito) aparece para o visitante, com Settings → tema claro, escuro ou do
# sistema (2026-11-10; o "minimal" escondia o menu e o visitante não tinha como escolher o tema)
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
