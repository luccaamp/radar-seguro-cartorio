# Tema do painel (docs/painel/padrao_visual.md, terceira rodada). Só aparência; nenhum dado.
[theme]
base = "light"
primaryColor = "#3366e6"
backgroundColor = "#f7f8fa"
secondaryBackgroundColor = "#eef3fd"
textColor = "#1f2937"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "8px"
borderColor = "#e5e7eb"
linkColor = "#3366e6"
chartCategoricalColors = ["#3366e6", "#e08a1e", "#9ca3af"]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eef3fd"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
