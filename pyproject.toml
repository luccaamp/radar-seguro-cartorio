[project]
name = "radar-seguro-cartorio"
version = "0.1.0"
description = "Painel de cartórios, simulador de seguro-garantia (Prov. CNJ 227/2026) e chat com fontes. Tudo local e gratuito."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "py7zr>=1.1.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbstripout>=0.9.1",
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
# só erros reais (pyflakes: imports e variáveis sem uso, nomes indefinidos). As regras de estilo ficam para outra
# rodada (docs/ESTADO_ATUAL.md, pendências; docs/erros_ia.md, 2026-10-20).
select = ["F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "visual: QA visual no navegador (Playwright); fora da suíte padrão, rodar com `uv run pytest -m visual`",
    "dados_reais: precisa do banco completo, do silver ou do bronze (dados da equipe); fora da suíte padrão, rodar com `uv run pytest -m dados_reais`",
]
addopts = "-m 'not visual and not dados_reais'"
