[project]
name = "radar-seguro-cartorio"
version = "0.1.0"
description = "Painel de cartórios, simulador de seguro-garantia (Prov. CNJ 227/2026) e chat com fontes. Tudo local e gratuito."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "mlxtend>=0.25.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "py7zr>=1.1.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbstripout>=0.9.1",
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
# as regras padrão do ruff (E4, E7, E9: imports, comandos e erros de sintaxe; F: pyflakes) e os avisos W (Fase 1,
# item 5, 2026-11-07). O comprimento de linha (E501) fica de fora: o projeto usa até 120 colunas e há ≈ 600 linhas
# acima disso, sem ganho de leitura em quebrar.
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# notebooks: o import depois do sys.path (E402) é o padrão de todos, e o código fica como foi rodado (a saída vai
# para o git, D-038); mudar o estilo de uma célula exige rodar o notebook de novo
"notebooks/*.ipynb" = ["E401", "E402", "E702", "E731", "E741"]
# registro dos testes T1 a T7 (D-039): reproduz os resultados byte a byte; fica como foi rodado
"scripts/testes_metodos.py" = ["E702", "E731", "E741", "W292"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "visual: QA visual no navegador (Playwright); fora da suíte padrão, rodar com `uv run pytest -m visual`",
    "dados_reais: precisa do banco completo, do silver ou do bronze (dados da equipe); fora da suíte padrão, rodar com `uv run pytest -m dados_reais`",
    "navegador: componente do painel num navegador de verdade (Playwright), no modo demonstração; fora da suíte padrão, rodar com `uv run pytest -m navegador` (D-083)",
]
addopts = "-m 'not visual and not dados_reais and not navegador'"
