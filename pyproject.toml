[project]
name = "radar-seguro-cartorio"
version = "0.1.0"
description = "Painel de cartórios, simulador de seguro-garantia (Prov. CNJ 227/2026) e chat com fontes. Tudo local e gratuito."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "py7zr>=1.1.4",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "playwright>=1.64.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["visual: QA visual no navegador (Playwright); fora da suíte padrão, rodar com `uv run pytest -m visual`"]
addopts = "-m 'not visual'"
