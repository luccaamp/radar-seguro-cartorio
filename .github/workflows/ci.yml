# CI (D-072, D-073): roda em cada pull request para a main e em cada push na main. O pull request só é juntado com
# os dois jobs verdes. Nenhum job usa a API do Gemini nem segredo: a suíte padrão roda sem chave e sem internet.
# Versões fixas (conferidas nas releases em 2026-11-10): actions/checkout v7 e astral-sh/setup-uv v10.3.3, as duas em
# Node 24 (o Node 20 foi depreciado nos runners); o setup-uv não publica mais a etiqueta curta (@v10 não existe) desde
# a v8. Ubuntu 26.04 fixo em vez de ubuntu-latest (a migração do rótulo termina em 2026-11-19; o Playwright do
# uv.lock, 1.64, já instala o Chromium nele: suporte desde a 1.61).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Testes e ruff
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Dependências (versões do uv.lock)
        run: uv sync --locked
      - name: ruff
        run: uv run ruff check .
      - name: Suíte padrão (sem dados reais, sem navegador), com a cobertura de src/ como indicador
        run: uv run pytest -q --cov=src --cov-report=term

  navegador:
    # D-083: o mapa clicável (componente HTML/JS dentro do Streamlit) num Chromium de verdade, no modo demonstração
    # (só o conjunto público versionado): o clique chega ao Python, 390 px sem rolagem lateral, tema escuro.
    name: Navegador (mapa clicável)
    needs: testes
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Dependências (versões do uv.lock)
        run: uv sync --locked
      - name: Chromium do Playwright
        run: uv run playwright install --with-deps chromium
      - name: Testes no navegador
        run: uv run pytest -q -m navegador

  dados-reais:
    # Modo completo do README (seção 1b): instala o silver de data/completo/, recalcula o gold e roda os testes com
    # os dados reais. Os que precisam do bronze (pacote da equipe) são pulados com o motivo "bronze ausente".
    name: Dados reais (modo completo)
    needs: testes
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Dependências (versões do uv.lock)
        run: uv sync --locked
      - name: Instalar o silver e o CSV do BI de data/completo/
        run: uv run python scripts/exportar_completo.py --instalar
      - name: Recalcular o gold a partir do silver
        run: uv run pipeline.py --a-partir-de silver
      - name: Testes com os dados reais
        run: uv run pytest -q -m dados_reais -rs
