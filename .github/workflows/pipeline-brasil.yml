# Pipeline do Brasil, camada 1 (D-087; Fase 4 do plano_projeto.md): todo mês coleta o cadastro do CNJ das 27 UFs e o
# IBGE, monta a tabela por UF, confere (contrato, variação contra a publicação anterior e os testes da pasta gerada) e
# publica uma Release datada `brasil-AAAA-MM-DD`, com o "o que mudou" nas notas. O painel lê a Release mais recente
# (src/painel/brasil.py); sem ela, a cópia versionada em data/brasil/.
#
# Qualquer problema bloqueia a publicação e abre uma issue (ou comenta na que já estiver aberta). "Simular falha" no
# Run workflow prova isso sem mexer em nada. Só a main publica: rodado numa branch (Run workflow → branch), é um
# ensaio completo sem Release. O IBGE não aceita conexão do GitHub Actions (2026-11-11): o pipeline usa então a
# referência versionada em data/brasil/ibge (muda no máximo uma vez por ano) e o manifesto registra isso. Custo zero (D-072): fontes públicas sem chave, sem segredo; o
# GITHUB_TOKEN da execução cria a Release e a issue.
name: Pipeline do Brasil

on:
  schedule:
    - cron: "23 10 5 * *"   # dia 5 de cada mês, 07:23 em Brasília (o cadastro do CNJ muda devagar)
  workflow_dispatch:
    inputs:
      simular_falha:
        description: "Simular uma falha (prova que nada é publicado e que a issue é aberta)"
        type: boolean
        default: false

concurrency:
  group: pipeline-brasil
  cancel-in-progress: false

permissions:
  contents: write   # criar a Release
  issues: write     # abrir a issue de falha

jobs:
  brasil:
    name: Coleta, contrato e publicação (27 UFs)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Dependências (versões do uv.lock)
        run: uv sync --locked
      - name: Publicação anterior (a Release brasil-* mais recente; sem ela, a cópia de data/brasil)
        id: anterior
        run: |
          tag=$(gh release list --limit 50 --json tagName,isDraft \
                  -q '[.[] | select(.isDraft | not) | select(.tagName | startswith("brasil-"))][0].tagName // ""')
          mkdir -p anterior
          if [ -n "$tag" ]; then gh release download "$tag" --dir anterior --pattern 'brasil_uf.csv'; else cp data/brasil/brasil_uf.csv anterior/; fi
          echo "tag=${tag:-data/brasil}" >> "$GITHUB_OUTPUT"
      - name: Coleta e montagem (contrato e variação)
        id: pipeline
        run: |
          set -o pipefail
          extra=""
          if [ "${{ inputs.simular_falha }}" = "true" ]; then extra="--simular-falha"; fi
          uv run python scripts/pipeline_brasil.py --coletar --bronze trabalho/bronze --anterior anterior --saida saida $extra | tee saida.log
      - name: Testes da pasta gerada (o mesmo teste que confere data/brasil)
        run: RADAR_BRASIL_TESTE=saida uv run pytest -q tests/test_brasil.py
      - name: Publicar a Release (só da main; numa branch, a execução é um ensaio)
        if: github.ref == 'refs/heads/main'
        run: |
          tag="brasil-$(date -u +%Y-%m-%d)"
          if gh release view "$tag" >/dev/null 2>&1; then tag="${tag}-r${{ github.run_number }}"; fi
          # --latest=false: a publicação mensal não toma o lugar da versão do projeto (v1.0, v2.0) como "Latest"
          gh release create "$tag" saida/brasil_uf.csv saida/malha_uf.geojson saida/manifesto.json saida/o_que_mudou.md \
            --latest=false --title "Brasil, camada 1 — $(date -u +%d/%m/%Y)" --notes-file saida/o_que_mudou.md
          { echo "✅ Publicado: **$tag** (anterior: ${{ steps.anterior.outputs.tag }})"; echo; cat saida/o_que_mudou.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Ensaio numa branch (nada publicado)
        if: github.ref != 'refs/heads/main'
        run: |
          { echo "🧪 Ensaio na branch \`${{ github.ref_name }}\`: tudo conferido, **nada publicado** (só a main publica)."; echo; cat saida/o_que_mudou.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Falhou? Nada publicado; abrir ou comentar a issue
        if: failure()
        run: |
          titulo="Pipeline do Brasil falhou"
          corpo="A execução ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} falhou em $(date -u +%Y-%m-%d) e **não publicou nada**; o painel continua com a última publicação boa.

          \`\`\`
          $(tail -n 30 saida.log 2>/dev/null || echo 'sem log: a falha foi antes da montagem')
          \`\`\`"
          aberta=$(gh issue list --state open --search "\"$titulo\" in:title" --json number -q '.[0].number // ""')
          if [ -n "$aberta" ]; then gh issue comment "$aberta" --body "$corpo"; else gh issue create --title "$titulo" --body "$corpo"; fi
          echo "❌ Nada publicado; issue aberta ou comentada." >> "$GITHUB_STEP_SUMMARY"
